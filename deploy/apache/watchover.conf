<VirtualHost *:80>
    ServerName watchover.tech
    ServerAlias www.watchover.tech
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
        DirectorySlash Off
    </Directory>

    <FilesMatch "(^\.env|^\.git|composer\.(json|lock)|^\.htaccess)$">
        Require all denied
    </FilesMatch>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On

    # Redirect root to login
    RewriteRule ^$ /login [R=302,L]

    # Block sensitive paths
    RewriteRule "(^|/)\.env$" - [F,L,NC]
    RewriteRule ^vendor(/|$) - [F,L]

    # Redirect /login/ to /login (remove trailing slash)
    RewriteRule ^login/$ /login [R=301,L]

    # Redirect /dashboard/ to /dashboard (remove trailing slash)
    RewriteRule ^dashboard/$ /dashboard [R=301,L]

    # Redirect /login/login.html to /login
    RewriteRule ^login/login\.html$ /login [R=301,L]

    # Redirect /dashboard/dashboard.html to /dashboard
    RewriteRule ^dashboard/dashboard\.html$ /dashboard [R=301,L]

    # Allow access to login and dashboard directories
    RewriteRule ^login/ - [L]
    RewriteRule ^dashboard/ - [L]

    # Keep A9G device API on HTTP (device can't do HTTPS)
    RewriteCond %{REQUEST_URI} ^/api\.php$ [NC]
    RewriteCond %{QUERY_STRING} (^|&)action=(save_gps|registerDevice)(&|$) [NC]
    RewriteRule ^ - [L]

    # Keep A9G AGPS proxy on HTTP (device can't do HTTPS)
    RewriteCond %{REQUEST_URI} ^/proxy_agps\.php$ [NC]
    RewriteRule ^ - [L]

    # Keep phpMyAdmin SSH tunnel on HTTP
    RewriteCond %{REQUEST_URI} ^/phpmyadmin(/|$) [NC]
    RewriteRule ^ - [L]

    # Redirect all other HTTP requests to HTTPS (clean URLs preserved)
    RewriteRule ^ https://watchover.tech%{REQUEST_URI} [R=301,L]
</VirtualHost>
