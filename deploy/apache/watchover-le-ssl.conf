<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName watchover.tech
    ServerAlias www.watchover.tech
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
        DirectorySlash Off
    </Directory>

    <FilesMatch "(^\.env|^\.git|composer\.(json|lock)|^\.htaccess)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(css|js|html)$">
        Header set Cache-Control "public, max-age=604800, must-revalidate"
    </FilesMatch>

    <FilesMatch "\.(jpg|jpeg|png|gif|ico|svg|webp)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    RewriteEngine On

    # Redirect root to login
    RewriteRule ^$ /login [R=302,L]

    # Block sensitive paths
    RewriteRule "(^|/)\.env$" - [F,L,NC]
    RewriteRule ^vendor(/|$) - [F,L]

    # Redirect /login/ to /login (remove trailing slash)
    RewriteRule ^login/$ /login [R=301,L]

    # Redirect /dashboard/ to /dashboard (remove trailing slash)
    RewriteRule ^dashboard/$ /dashboard [R=301,L]

    # Redirect /login/login.html to /login
    RewriteRule ^login/login\.html$ /login [R=301,L]

    # Redirect /dashboard/dashboard.html to /dashboard
    RewriteRule ^dashboard/dashboard\.html$ /dashboard [R=301,L]

    # Allow access to login and dashboard directories
    RewriteRule ^login/ - [L]
    RewriteRule ^dashboard/ - [L]

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/watchover.tech/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/watchover.tech/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
